}

// ── EXPORT / SHARE ──
function dayText(k){
  const e=getEntry(k);if(!e)return '';
  const d=parseKey(k),v=e.v||{};
  let out=fmtFull(d).toUpperCase()+'\n';
  const g=goodArr(e).map((x,i)=>String(x||'').trim()?`${i+1}. ${x.trim()}`:'').filter(Boolean);
  if(g.length)out+=`\nTHREE GOOD THINGS\n${g.join('\n')}\n`;
  if(String(v.intention||'').trim())out+=`\nONE THING I WILL DO\n${v.intention.trim()}${e.done===true?'  (done ✓)':e.done===false?'  (not done)':''}\n`;
  if(String(v.notes||'').trim())out+=`\nABOUT TODAY\n${v.notes.trim()}\n`;
  return out;
}
function dataURLtoBlob(u){const p=u.split(',');const m=p[0].match(/:(.*?);/)[1];const b=atob(p[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:m});}
async function shareDay(k){
  flushDrafts();
  const e=getEntry(k);
  if(!e){alert('Nothing written for this day yet.');return;}
  const text=dayText(k),title='Daybook — '+fmtLong(parseKey(k));
  try{
    const hasMedia=((e.photos||[]).length||(e.videos||[]).length);
    if(navigator.canShare&&hasMedia){
      const files=[];
      for(const p of (e.photos||[])){
        try{let blob=await idbGetPhoto(p.id);if(!blob)blob=await ensurePhotoLocal(p.id);if(!blob&&p.img)blob=dataURLtoBlob(p.img);if(blob)files.push(new File([blob],`photo-${files.length+1}.jpg`,{type:'image/jpeg'}));}catch(err){}
      }
      for(const v of (e.videos||[])){
        try{const blob=await idbGetVideo(v.id);if(blob)files.push(new File([blob],v.name||'video.mp4',{type:v.mime||'video/mp4'}));}catch(err){}
      }
      if(files.length&&navigator.canShare({files,text})){await navigator.share({title,text,files});return;}
    }
    if(navigator.share){await navigator.share({title,text});return;}
  }catch(err){if(err&&err.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(text);alert('Copied to clipboard ✓');}catch(e2){alert(text);}
}
async function photoDataURL(p){
  try{let blob=await idbGetPhoto(p.id);if(!blob)blob=await ensurePhotoLocal(p.id);if(blob)return await blobToDataURL(blob);}catch(e){}
  return p.thumb||p.img||'';
}
async function entryHTML(k){
  const e=getEntry(k);if(!e)return '';
  const d=parseKey(k),v=e.v||{};
  let h=`<article><h2>${esc(fmtFull(d))}</h2>`;
  const g=goodArr(e).filter(x=>String(x||'').trim());
  if(g.length)h+=`<h3>Three good things</h3><ol>${g.map(x=>`<li>${esc(x.trim())}</li>`).join('')}</ol>`;
  if(String(v.intention||'').trim())h+=`<h3>One thing I will do</h3><p>${esc(v.intention.trim())}${e.done===true?' — <b>done ✓</b>':e.done===false?' — not done':''}</p>`;
  if(String(v.notes||'').trim())h+=`<h3>About today</h3><p>${esc(v.notes.trim()).replace(/\n/g,'<br/>')}</p>`;
  if((e.photos||[]).length){
    const urls=await Promise.all(e.photos.map(photoDataURL));
    const imgs=urls.filter(Boolean).map(u=>`<img src="${u}"/>`).join('');
    if(imgs)h+=`<div class="ph">${imgs}</div>`;
  }
  if((e.videos||[]).length){
    h+=`<div class="ph">${e.videos.map(v=>`<img src="${v.thumb||''}"/>`).join('')}</div><p style="font-size:.75rem;color:#998;font-style:italic">Videos are not included in this export — use Share on the day to send the video files.</p>`;
  }
  return h+'</article>';
}
async function exportDoc(keys,title){
  const s=settingsData(),v=themeVars();
  const f=FONTS.find(x=>x.n===s.font)||FONTS[0];
  const body=(await Promise.all(keys.map(entryHTML))).join('');
  return `<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>${esc(title)}</title>
<link href="https://fonts.googleapis.com/css2?family=${encodeURIComponent(s.font).replace(/%20/g,'+')}:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>body{font-family:${f.css};background:#fff;color:#1c1712;max-width:640px;margin:0 auto;padding:40px 22px;line-height:1.6}
h1{font-size:1.9rem;border-bottom:3px solid #1c1712;padding-bottom:10px;margin-bottom:8px}
.sub{font-size:.8rem;letter-spacing:.25em;text-transform:uppercase;color:#998;margin-bottom:36px}
article{margin-bottom:44px;page-break-inside:avoid}
h2{font-size:1.3rem;margin-bottom:4px}
h3{font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;color:#998;margin:18px 0 6px}
ol{padding-left:22px}li{margin-bottom:4px}p{white-space:normal}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:16px}
.ph img{width:100%;border-radius:4px}
@media print{body{padding:0}}</style></head>
<body><h1>${esc(title)}</h1><div class="sub">From my Daybook</div>${body}</body></html>`;
}
function download(name,content,type){
  const b=new Blob([content],{type});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
async function downloadDay(k){
  flushDrafts();
  if(!getEntry(k)){alert('Nothing written for this day yet.');return;}
  download(`daybook-${k}.html`,await exportDoc([k],fmtFull(parseKey(k))),'text/html');
}
function monthKeysFor(y,m){return liveEntryKeys().filter(k=>k.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)).sort();}
async function downloadMonth(y,m){
  const keys=monthKeysFor(y,m);
  if(!keys.length){alert('No entries this month yet.');return;}
  download(`daybook-${y}-${String(m+1).padStart(2,'0')}.html`,await exportDoc(keys,monthName(y,m)),'text/html');
}
async function printMonth(y,m){
  const keys=monthKeysFor(y,m);
  if(!keys.length){alert('No entries this month yet.');return;}
  const w=window.open('','_blank');
  if(!w){alert('Pop-up blocked — allow pop-ups to print.');return;}
  w.document.write('<!doctype html><meta charset="utf-8"><body style="font-family:sans-serif;color:#666;padding:28px">Preparing your month…</body>');
  const html=await exportDoc(keys,monthName(y,m));
  w.document.open();w.document.write(html);w.document.close();
  setTimeout(()=>{try{w.print();}catch(e){}},700);
}
async function shareMonth(y,m){
  const keys=monthKeysFor(y,m);
  if(!keys.length){alert('No entries this month yet.');return;}
  const text=monthName(y,m).toUpperCase()+'\n\n'+keys.map(dayText).join('\n──────────\n\n');
  try{if(navigator.share){await navigator.share({title:'Daybook — '+monthName(y,m),text});return;}}catch(err){if(err&&err.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(text);alert('Copied to clipboard ✓');}catch(e2){}
}

// ── BACKUP ──
function exportBackup(){
  download(`daybook-backup-${dkey(new Date())}.json`,JSON.stringify({v:1,entries:userData('entries',{}),templates:userData('templates',[]),settings:userData('settings',{}),stars:userData('stars',{}),scorecard:userData('scorecard',{}),workouts:userData('workouts',{}),exported:Date.now()}),'application/json');
}
function importBackup(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=async ev=>{
    try{
      const p=JSON.parse(ev.target.result);
      if(!p||typeof p.entries!=='object')throw new Error('bad file');
      const lE=userData('entries',{});
      Object.entries(p.entries).forEach(([k,e])=>{const cur=lE[k];if(!cur||(e.updated||0)>(cur.updated||0))lE[k]=e;});
      setStore(userKey('entries'),lE);
      if(Array.isArray(p.templates)){
        const lT=userData('templates',[]);const byId={};
        lT.concat(p.templates).forEach(t=>{const c=byId[t.id];if(!c||(t.updated||0)>(c.updated||0))byId[t.id]=t;});
        setStore(userKey('templates'),Object.values(byId));
      }
      if(p.scorecard&&typeof p.scorecard==='object'){
        const lSc=userData('scorecard',{});
        if((p.scorecard.updated||0)>=(lSc.updated||0))setStore(userKey('scorecard'),p.scorecard);
      }
      if(p.stars&&typeof p.stars==='object'){
        const lSt=userData('stars',{});
        if((p.stars.updated||0)>=(lSt.updated||0))setStore(userKey('stars'),p.stars);
      }
      if(p.workouts&&typeof p.workouts==='object'){
        const lW=userData('workouts',{});
        if((p.workouts.updated||0)>=(lW.updated||0))setStore(userKey('workouts'),p.workouts);
      }
      await migrateInlinePhotos();
      saveData('entries',userData('entries',{}));
      alert('Backup imported ✓');showView('settings');
    }catch(e){alert('That file could not be read as a Daybook backup.');}
  };
  r.readAsText(file);
}

// ── SETTINGS ──
function renderSettings(el){
  const s=settingsData();
  const driveOn=!!localStorage.getItem(`journal_drive_on_${currentUser}`);
  const driveErr=sessionStorage.getItem('journal_drive_err')||lastSyncError;
  let syncBlock;
  if(currentUser==='local'){
    syncBlock=`<div class="sync-status">You are using Daybook on this device only.<br/>Sign out and sign in with Google to sync across devices.</div>
      <div class="set-row"><button class="btn" onclick="signOut()">Go to sign in</button></div>`;
  }else{
    syncBlock=`<div class="sync-status">
      ${driveAccessToken?`<span class="ok">Sync is on ✓</span> — your journal is saved to your Google Drive automatically.`:(driveOn?`Sync was on, but needs reconnecting.`:`Sync is off. Turn it on to keep every device up to date.`)}
      ${lastSyncAt?`<br/>Last synced ${new Date(lastSyncAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`:''}
      ${driveErr?`<br/><span class="err">${esc(driveErr)}</span>`:''}
    </div>
    <div class="set-row">
      ${driveAccessToken?`<button class="btn" onclick="driveSyncNow(true)">Sync now</button><button class="btn danger" onclick="disableDriveSync()">Turn off</button>`
        :`<button class="btn primary" onclick="enableDriveSync()">${driveOn?'Reconnect sync':'Turn on sync'}</button>`}
    </div>`;
  }
  const gd=s.gdriveBackup||{};
  const bkConnected=hasBkToken();
  const bkErr=sessionStorage.getItem('journal_bkdrive_err')||lastBkBackupError;
  let gdBlock;
  if(!bkConnected){
    gdBlock=`<div class="sync-status">Keep a visible backup file in a Google Drive folder you choose — separate from the automatic sync above. Connecting asks for a broader Google Drive permission, so you may see an "unverified app" notice; that's expected for this project and safe to continue through.
      ${gd.folderId?`<br/>Was backing up to <b>${esc(gd.folderName||'Google Drive')}</b> — reconnect to resume.`:''}
      ${bkErr?`<br/><span class="err">${esc(bkErr)}</span>`:''}
    </div>
      <div class="set-row"><button class="btn primary" onclick="bkDriveAuthRedirect(true)">${gd.folderId?'Reconnect':'Connect'} Google Drive backup</button>${gd.folderId?`<button class="btn danger" onclick="bkDisconnect()">Disconnect</button>`:''}</div>`;
  }else if(!gd.folderId){
    gdBlock=`<div class="sync-status">Connected. Choose a folder in your Google Drive to back up into.</div>
      <div class="set-row"><button class="btn primary" onclick="openBkFolderPicker()">Choose folder</button><button class="btn danger" onclick="bkDisconnect()">Disconnect</button></div>`;
  }else{
    gdBlock=`<div class="sync-status">
      Backing up to <b>${esc(gd.folderName||'Google Drive')}</b> ${gd.enabled?'<span class="ok">— on ✓</span>':'— paused'}
      ${lastBkBackupAt?`<br/>Last backed up ${new Date(lastBkBackupAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`:''}
      ${lastBkBackupError?`<br/><span class="err">${esc(lastBkBackupError)}</span>`:''}
    </div>
    <div class="set-row">
      <button class="btn" onclick="bkBackupNow(true)">Back up now</button>
      <button class="btn" onclick="toggleBkBackup()">${gd.enabled?'Pause':'Resume'}</button>
      <button class="btn" onclick="openBkFolderPicker()">Change folder</button>
      <button class="btn danger" onclick="bkDisconnect()">Disconnect</button>
    </div>`;
  }
  const permOk=('Notification' in window)&&Notification.permission==='granted';
  const permDenied=('Notification' in window)&&Notification.permission==='denied';
  const DOWLBL=[['Mon',1],['Tue',2],['Wed',3],['Thu',4],['Fri',5],['Sat',6],['Sun',0]];
  const reminders=s.reminders||[];
  const remRows=reminders.map(r=>{
    const daysLabel=(r.days||[]).length===7?'Every day':DOWLBL.filter(d=>(r.days||[]).includes(d[1])).map(d=>d[0]).join(' ');
    return `<div class="tpl-list-item">
      <span class="tli-name">${esc(r.label||'Reminder')}<span class="tli-tag">${esc(r.time)} · ${esc(daysLabel)}</span>${!r.enabled?'<span class="tli-tag">Paused</span>':''}</span>
      <span class="tli-actions">
        <button class="icon-btn" title="${r.enabled?'Pause':'Resume'}" onclick="toggleReminder('${r.id}')"><svg viewBox="0 0 24 24">${r.enabled?'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>':'<polygon points="5 3 19 12 5 21 5 3"/>'}</svg></button>
        <button class="icon-btn" title="Edit" onclick="editReminder('${r.id}')"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        <button class="icon-btn" title="Delete" onclick="deleteReminder('${r.id}')"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </span></div>`;
  }).join('')||'<div class="empty-note" style="padding:16px 0">No reminders yet.</div>';
  const remindersBlock=`<div class="sync-status">
      ${permOk?'<span class="ok">Notifications are on ✓</span>':(permDenied?'<span class="err">Notifications are blocked — turn them on for this site in your browser settings.</span>':'Turn on notifications so reminders can appear.')}
      <br/>Reminders are best-effort: they usually arrive on time while Daybook is installed and opened now and then, but the browser can delay or skip one if it hasn’t run for a while — there’s no server pushing these.
    </div>
    ${(!permOk&&!permDenied)?`<div class="set-row"><button class="btn primary" onclick="requestNotifPermission()">Enable notifications</button></div>`:''}
    ${remRows}
    <div style="margin-top:12px"><button class="btn" onclick="editReminder(null)">+ Add a reminder</button></div>`;
  el.innerHTML=`<div class="section-rule"><div><div class="section-title" style="font-family:'Cormorant Garamond',serif">Style</div><div class="section-sub">Make it yours</div></div></div>

  <div class="set-block"><div class="set-label">Theme</div>
    <div class="theme-grid">
      ${THEMES.map(t=>`<button class="theme-swatch ${s.theme===t.id?'on':''}" onclick="saveSettings({theme:'${t.id}'});showView('settings')">
        <span class="ts-dots"><span style="background:${t.v.bg}"></span><span style="background:${t.v.ink}"></span><span style="background:${t.v.accent}"></span></span>
        <span class="ts-name">${t.name}</span></button>`).join('')}
      <button class="theme-swatch ${s.theme==='custom'?'on':''}" onclick="saveSettings({theme:'custom'});showView('settings')">
        <span class="ts-dots"><span style="background:${esc(s.custom.bg)}"></span><span style="background:${esc(s.custom.ink)}"></span><span style="background:${esc(s.custom.accent)}"></span></span>
        <span class="ts-name">Custom</span></button>
    </div>
    ${s.theme==='custom'?`<div class="custom-colors">
      <label class="cc-item"><input type="color" value="${esc(s.custom.bg)}" onchange="setCustomColor('bg',this.value)"/>Page</label>
      <label class="cc-item"><input type="color" value="${esc(s.custom.ink)}" onchange="setCustomColor('ink',this.value)"/>Ink</label>
      <label class="cc-item"><input type="color" value="${esc(s.custom.accent)}" onchange="setCustomColor('accent',this.value)"/>Accent</label>
    </div>`:''}
  </div>

  <div class="set-block"><div class="set-label">Writing font</div>
    <div class="sync-status" style="margin-bottom:12px">The font your journal entries are written in.</div>
    <div class="font-list">${FONTS.map(f=>`<button class="font-opt ${s.font===f.n?'on':''}" style="font-family:${f.css}" onclick="saveSettings({font:'${f.n}'});showView('settings')">${f.n}<small>${f.tag}</small></button>`).join('')}</div>
  </div>

  <div class="set-block"><div class="set-label">Text size</div>
    <div class="size-row">${[['s','Small'],['m','Medium'],['l','Large'],['xl','Extra']].map(([id,n])=>`<button class="size-opt ${s.size===id?'on':''}" onclick="saveSettings({size:'${id}'});showView('settings')">${n}</button>`).join('')}</div>
  </div>


  <div class="set-block"><div class="set-label">Reminders</div>${remindersBlock}</div>

  <div class="set-block"><div class="set-label">Sync</div>${syncBlock}</div>

  <div class="set-block"><div class="set-label">Google Drive backup</div>${gdBlock}</div>

  <div class="set-block"><div class="set-label">Your data</div>
    <div class="sync-status">Includes your written entries, templates, settings and photos. Videos live only on the device you added them on, so they are not included here or in sync/backup above.</div>
    <div class="set-row">
      <button class="btn" onclick="exportBackup()">Download full backup</button>
      <button class="btn" onclick="document.getElementById('import-file').click()">Import backup</button>
    </div>
  </div>

  <div class="set-block"><div class="set-label">Account</div>
    <div class="signed-in-as">${currentUser==='local'?'Using on this device only.':`Signed in as <b>${esc(currentUserName)}</b>${currentUserEmail?` (${esc(currentUserEmail)})`:''}`}</div>
    <div class="set-row"><button class="btn" onclick="signOut()">Sign out</button></div>
  </div>`;
}
function setCustomColor(k,val){const s=settingsData();const c=Object.assign({},s.custom);c[k]=val;saveSettings({custom:c});showView('settings');}

// ── MODAL ──
function openModal(body,title){
  document.getElementById('modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-box"><div class="modal-head"><span class="modal-title" style="font-family:'Cormorant Garamond',serif">${esc(title||'')}</span><button class="modal-close" onclick="closeModal()">×</button></div>${body}</div></div>`;
}
function closeModal(){
  document.querySelectorAll('#modal-root [data-blob-url]').forEach(el=>{try{URL.revokeObjectURL(el.dataset.blobUrl);}catch(e){}});
  document.getElementById('modal-root').innerHTML='';
}
