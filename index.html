<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#f7f3ee" id="theme-color-meta"/>
<title>DAYBOOK</title>
<link rel="manifest" href="manifest.json"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;600&family=Nunito:wght@400;600;700&family=Caveat:wght@400;600&family=Patrick+Hand&family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f7f3ee;--panel:#fffdf9;--ink:#201810;--muted:#8b7d6b;--line:#e6dccb;--accent:#a85c32;--accent-soft:rgba(168,92,50,.12);--fs:16px}
html{font-size:var(--fs)}
body{font-family:'EB Garamond',serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
input,textarea,select{font-family:inherit;font-size:1rem;color:var(--ink);background:transparent}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.55;font-style:italic}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;color:var(--ink)}
a{color:var(--ink)}img{display:block;max-width:100%}select{cursor:pointer}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");opacity:.35}

/* AUTH */
#auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
#auth-screen::before,#auth-screen::after{content:'';position:absolute;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,var(--ink) 0,var(--ink) 26px,transparent 26px,transparent 52px)}
#auth-screen::before{top:0}#auth-screen::after{bottom:0}
.auth-box{max-width:380px;width:100%;text-align:center;position:relative;z-index:1}
.masthead-sub{font-size:.6rem;letter-spacing:.5em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.masthead-title{font-size:4.2rem;font-weight:700;line-height:.9;letter-spacing:-.02em}
.masthead-rule{width:48px;height:1px;background:var(--accent);margin:22px auto 12px}
.masthead-tagline{font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:44px}
#g_signin_btn{display:flex;justify-content:center;min-height:44px}
.auth-note{font-size:.8rem;color:var(--muted);margin-top:18px;font-style:italic;line-height:1.6}
.auth-local{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:.8rem;margin-top:26px;font-style:italic}

/* SHELL */
#app{display:none;min-height:100vh;flex-direction:column}
#app.visible{display:flex}
header{position:sticky;top:0;z-index:200;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.header-stripe{height:3px;background:repeating-linear-gradient(90deg,var(--ink) 0,var(--ink) 22px,transparent 22px,transparent 44px)}
.header-inner{max-width:720px;margin:0 auto;padding:10px 20px 8px;display:flex;align-items:baseline;justify-content:space-between}
.brand-name{font-size:1.45rem;font-weight:700;letter-spacing:.06em}
.brand-sub{font-size:.55rem;letter-spacing:.4em;text-transform:uppercase;color:var(--muted)}
main{max-width:720px;margin:0 auto;width:100%;flex:1;padding:22px 18px calc(96px + env(safe-area-inset-bottom))}

/* BOTTOM NAV */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:300;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(10px + env(safe-area-inset-bottom))}
.nav-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;padding:4px 10px;transition:color .2s}
.nav-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active{color:var(--accent)}

/* SECTION HEAD */
.section-rule{border-top:3px solid var(--ink);padding-top:14px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
.section-title{font-size:1.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.section-sub{font-size:.82rem;color:var(--muted);font-style:italic;margin-top:2px}

/* EDITOR */
.day-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.day-step{background:var(--panel);border:1px solid var(--line);width:40px;height:40px;font-size:1.25rem;color:var(--muted);border-radius:50%;flex-shrink:0;transition:color .2s}
.day-step:not(:disabled):hover{color:var(--ink)}
.day-step:disabled{opacity:.3;cursor:default}
.day-title{text-align:center;flex:1;min-width:0}
.day-dow{font-size:.62rem;letter-spacing:.35em;text-transform:uppercase;color:var(--accent)}
.day-date{font-size:1.5rem;font-weight:700;line-height:1.15}
.today-jump{display:block;margin:2px auto 0;background:none;border:none;color:var(--muted);font-size:.75rem;font-style:italic;text-decoration:underline}
.tpl-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 20px}
.tpl-row label{font-size:.6rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)}
.tpl-row select{border:1px solid var(--line);background:var(--panel);padding:5px 8px;font-size:.85rem;border-radius:3px;max-width:220px}
.field{margin-bottom:22px}
.field-label{font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:600}
.vfield{display:flex;gap:8px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 10px 10px 12px;transition:border-color .2s}
.vfield:focus-within{border-color:var(--accent)}
.vfield input,.vfield textarea{flex:1;border:none;outline:none;resize:none;line-height:1.55;min-width:0}
.vfield textarea{min-height:24px;overflow:hidden}
.vfield.tall textarea{min-height:120px}
.list-num{font-size:.85rem;color:var(--accent);font-weight:600;padding-top:2px;width:16px;flex-shrink:0;font-style:italic}
.vfield+.vfield{margin-top:8px}
.mic{background:none;border:none;padding:0 2px;color:var(--muted);flex-shrink:0;transition:color .2s;line-height:0}
.mic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mic.rec{color:var(--accent);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.15)}}
.mood-row{display:flex;gap:6px}
.mood-opt{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .2s}
.mood-opt .m-emoji{font-size:1.3rem;filter:grayscale(1);opacity:.55;transition:all .2s}
.mood-opt .m-label{font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mood-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.mood-opt.on .m-emoji{filter:none;opacity:1;transform:scale(1.12)}
.mood-opt.on .m-label{color:var(--accent);font-weight:600}
.photo-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px}
.photo-thumb{aspect-ratio:1;overflow:hidden;border:1px solid var(--line);border-radius:4px;cursor:pointer;background:var(--panel)}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.video-thumb{position:relative;aspect-ratio:1;overflow:hidden;border:1px solid var(--line);border-radius:4px;cursor:pointer;background:#000}
.video-thumb img{width:100%;height:100%;object-fit:cover;opacity:.85}
.play-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.play-badge svg{width:28px;height:28px}
.photo-add-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.editor-foot{display:flex;justify-content:space-between;align-items:center;margin:6px 0 18px;font-size:.75rem;color:var(--muted);font-style:italic}
.entry-actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
#file-cam,#file-lib,#file-vid-cam,#file-vid-lib,#import-file{display:none}

/* BUTTONS */
.btn{background:var(--panel);border:1px solid var(--line);padding:9px 16px;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);border-radius:3px;display:inline-flex;align-items:center;gap:7px;transition:all .2s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--accent);border-color:var(--accent-soft)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn.small{padding:6px 11px;font-size:.6rem}

/* TIMELINE */
.search-wrap{margin-bottom:18px}
.search-wrap input{width:100%;border:1px solid var(--line);background:var(--panel);padding:10px 14px;border-radius:4px;outline:none}
.search-wrap input:focus{border-color:var(--accent)}
.entry-card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:14px;cursor:pointer;transition:box-shadow .2s,border-color .2s}
.entry-card:hover{border-color:var(--accent);box-shadow:0 3px 16px rgba(0,0,0,.06)}
.ec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.ec-date{font-weight:700;font-size:1.05rem}
.ec-meta{font-size:.72rem;color:var(--muted);font-style:italic;white-space:nowrap}
.ec-snippet{font-size:.92rem;line-height:1.55;color:var(--ink);opacity:.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ec-photos{display:flex;gap:6px;margin-top:10px}
.ec-photos img{width:52px;height:52px;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
.ec-video-wrap{position:relative;display:inline-block}
.ec-video-wrap svg{position:absolute;inset:0;margin:auto;width:16px;height:16px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.empty-note{text-align:center;color:var(--muted);font-style:italic;padding:48px 20px;line-height:1.7}

/* CALENDAR */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-title{font-size:1.3rem;font-weight:700}
.cal-stats{display:flex;gap:18px;margin-bottom:16px;font-size:.78rem;color:var(--muted);font-style:italic}
.cal-stats b{color:var(--accent);font-style:normal}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:20px}
.cal-dow{text-align:center;font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding:4px 0}
.cal-cell{aspect-ratio:1;border:1px solid transparent;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.85rem;color:var(--muted);background:none;position:relative}
.cal-cell.in-month{color:var(--ink);background:var(--panel);border-color:var(--line);cursor:pointer}
.cal-cell.today{border-color:var(--accent);font-weight:700}
.cal-cell .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal-cell .m-mini{font-size:.7rem;line-height:1;position:absolute;top:3px;right:3px}
.export-block{border-top:1px solid var(--line);padding-top:16px}
.export-label{font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:600}
.export-row{display:flex;gap:8px;flex-wrap:wrap}

/* SETTINGS */
.set-block{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:16px}
.set-label{font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:600}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.theme-swatch{border:2px solid var(--line);border-radius:5px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;transition:border-color .2s}
.theme-swatch.on{border-color:var(--accent)}
.ts-dots{display:flex;gap:3px}
.ts-dots span{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
.ts-name{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.custom-colors{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap}
.cc-item{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.cc-item input[type=color]{width:44px;height:44px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--panel);cursor:pointer}
.font-list{display:flex;flex-direction:column;gap:6px}
.font-opt{border:1px solid var(--line);background:none;border-radius:4px;padding:10px 14px;text-align:left;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center;transition:border-color .2s}
.font-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.font-opt small{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-family:'EB Garamond',serif}
.size-row{display:flex;gap:8px}
.size-opt{flex:1;border:1px solid var(--line);background:none;border-radius:4px;padding:8px 4px;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.size-opt.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.tpl-list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tpl-list-item:last-child{border-bottom:none}
.tli-name{font-size:.98rem}
.tli-tag{font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:2px 6px;margin-left:8px;vertical-align:2px}
.tli-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{background:none;border:1px solid var(--line);border-radius:3px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:all .2s}
.icon-btn:hover{color:var(--ink);border-color:var(--ink)}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sync-status{font-size:.82rem;font-style:italic;color:var(--muted);line-height:1.6;margin-bottom:12px}
.sync-status .ok{color:#2a5f3f}.sync-status .err{color:#a82020}
.set-row{display:flex;gap:8px;flex-wrap:wrap}
.signed-in-as{font-size:.9rem;margin-bottom:12px;line-height:1.5}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(20,14,8,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:14px}
.modal-box{background:var(--bg);max-width:520px;width:100%;max-height:90vh;overflow-y:auto;padding:26px 24px;border-top:3px solid var(--ink);border-radius:0 0 6px 6px;animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.modal-title{font-size:1.15rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.modal-close{background:none;border:none;color:var(--muted);font-size:1.5rem;line-height:1;padding:0 0 0 14px}
.photo-full img{width:100%;border-radius:4px;margin-bottom:14px}

/* TEMPLATE BUILDER */
.tb-name input{width:100%;border:1px solid var(--line);background:var(--panel);padding:10px 12px;border-radius:4px;outline:none;font-size:1rem;margin-bottom:16px}
.tb-field{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:12px;margin-bottom:10px}
.tb-field-top{display:flex;gap:8px;margin-bottom:8px}
.tb-field-top input{flex:1;border:none;border-bottom:1px solid var(--line);outline:none;padding:2px 0;min-width:0}
.tb-field-bottom{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb-field-bottom select{border:1px solid var(--line);background:var(--bg);padding:4px 6px;font-size:.78rem;border-radius:3px}
.tb-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
@media print{#bottom-nav,header,body::after{display:none!important}}

/* STARS / REWARDS */
.stars-fab{position:fixed;right:18px;bottom:calc(104px + env(safe-area-inset-bottom));z-index:260;width:54px;height:54px;border-radius:50%;background:var(--ink);border:none;color:#d9a848;font-size:1.5rem;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.22);transition:transform .2s}
.stars-fab:active{transform:scale(.94)}
.stars-balance-card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px;padding:20px 20px 22px;margin-bottom:22px}
.stars-balance-head{display:flex;align-items:center;gap:7px;font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
.stars-info-btn{background:none;color:var(--muted);width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--muted);border-radius:50%;font-size:.6rem;font-style:italic;line-height:1}
.stars-info-btn:hover{color:var(--ink);border-color:var(--ink)}
.stars-balance-num{font-family:'Cormorant Garamond',serif;font-size:2.6rem;font-weight:700;color:var(--ink);display:flex;align-items:baseline;gap:8px;margin-bottom:18px}
.stars-balance-num .star{color:#c99a2e;font-size:.55em}
.stars-slider-track{position:relative;height:8px;background:var(--bg);border:1px solid var(--line);border-radius:4px;margin:0 8px 8px}
.stars-slider-fill{position:absolute;left:0;top:0;bottom:0;background:#c99a2e;border-radius:4px;transition:width .5s}
.stars-slider-dot{position:absolute;top:50%;width:16px;height:16px;background:var(--panel);border:3px solid #c99a2e;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.stars-slider-mark{position:absolute;top:50%;width:24px;height:24px;background:var(--panel);border:2px solid var(--ink);border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:.52rem;font-weight:700;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18);z-index:2}
.stars-slider-ticks{display:flex;justify-content:space-between;font-size:.62rem;color:var(--muted);letter-spacing:.05em;margin:0 0 18px}
.stars-tab-row{display:flex;gap:8px;margin-bottom:16px}
.stars-tab{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 6px;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);transition:all .2s}
.stars-tab.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.stars-item-value{font-family:'Cormorant Garamond',serif;font-size:1rem;color:#c99a2e;white-space:nowrap;flex-shrink:0}

/* ============ EDITORIAL LAYER — modern refresh (overrides the rules above) ============ */
/* Typography: clean sans for all UI; serif reserved for large display; the user's chosen
   font stays for their actual writing. No tracked ALL-CAPS micro-labels, no italics. */
:root{--sans:'DM Sans',system-ui,-apple-system,"Segoe UI",sans-serif;--serif:'Cormorant Garamond',serif}
#app,#auth-screen,.modal-box{font-family:var(--sans)}
body{font-family:var(--sans)}
/* The journal writing itself keeps the user's chosen font */
.vfield input,.vfield textarea,.ec-snippet{font-family:var(--user-font,'EB Garamond',serif)}
/* Large display stays serif, with proper lining numerals (so "1" isn't an "I") */
.section-title,.modal-title,.day-date,.cal-title,.masthead-title,.brand-name,.ec-date,
.stars-balance-num,.stars-item-value,.cal-title{font-family:var(--serif)}
.day-date,.cal-title,.stars-balance-num,.stars-item-value,.ec-date,.cal-cell,.stars-slider-ticks,
.cal-stats b,.stars-slider-mark{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1,"onum" 0}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function getStore(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function setStore(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){alert('Storage is full — try removing some photos from older entries.');}}
function userKey(k){return `journal_${currentUser}_${k}`;}
function userData(k,d){return getStore(userKey(k),d);}
function saveData(k,v){setStore(userKey(k),v);scheduleDriveSync();scheduleBkBackup();}
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseKey(k){const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function fmtDow(d){return d.toLocaleDateString('en-GB',{weekday:'long'});}
function fmtLong(d){return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}
function fmtFull(d){return fmtDow(d)+' '+fmtLong(d);}
function monthName(y,m){return new Date(y,m,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});}

// ── DATA ──
function getEntriesRaw(){return userData('entries',{});}
function getEntry(k){const e=getEntriesRaw()[k];return (e&&!e.deleted)?e:null;}
function putEntry(k,e){const all=getEntriesRaw();e.updated=Date.now();all[k]=e;saveData('entries',all);}
function liveEntryKeys(){const all=getEntriesRaw();return Object.keys(all).filter(k=>!all[k].deleted&&entryHasContent(all[k]));}
// Fixed daily structure (templates replaced): three good things (about the day before,
// filled in the morning) in v.good[], one intention in v.intention, the evening reflection
// in v.notes (same id old entries used), and whether the intention was kept in e.done.
function goodArr(e){const v=(e&&e.v&&e.v.good);return Array.isArray(v)?v:[];}
function entryHasContent(e){if(!e)return false;if((e.photos||[]).length||(e.videos||[]).length)return true;if(e.done===true||e.done===false)return true;const v=e.v||{};if(goodArr(e).some(x=>String(x||'').trim()))return true;if(String(v.intention||'').trim())return true;if(String(v.notes||'').trim())return true;
  // legacy entries may hold text under other field ids
  return Object.values(v).some(x=>Array.isArray(x)?x.some(y=>String(y||'').trim()):(typeof x==='string'&&x.trim()));}
function settingsData(){return Object.assign({font:'EB Garamond',theme:'paper',size:'m',reminders:[],custom:{bg:'#f7f3ee',ink:'#201810',accent:'#a85c32'}},userData('settings',{}));}
function saveSettings(patch){const s=Object.assign(settingsData(),patch);s.updated=Date.now();saveData('settings',s);applyAppearance();mirrorReminders(s);}
function entrySnippet(e){const g=goodArr(e).filter(x=>String(x||'').trim());if(g.length)return g.join(' · ');const v=e.v||{};if(String(v.notes||'').trim())return v.notes.trim();if(String(v.intention||'').trim())return 'I will '+v.intention.trim().replace(/^i will\s+/i,'');
  for(const x of Object.values(v)){if(Array.isArray(x)){const t=x.filter(y=>String(y||'').trim()).join(' · ');if(t)return t;}else if(typeof x==='string'&&x.trim())return x.trim();}return '';}
function entryWords(e){const v=(e&&e.v)||{};let t=goodArr(e).join(' ')+' '+(v.intention||'')+' '+(v.notes||'');return t.split(/\s+/).filter(Boolean).length;}

// ── DRIVE SYNC (redirect flow, per-day merge) ──
function checkDriveRedirect(){
  if(!location.hash)return;
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('state')!=='journal_drive')return;
  const err=h.get('error');
  if(err){sessionStorage.setItem('journal_drive_err',err);}
  else if(h.get('access_token')){
    const exp=Date.now()+(parseInt(h.get('expires_in')||'3600',10)-60)*1000;
    localStorage.setItem('journal_drive_tok',JSON.stringify({tok:h.get('access_token'),exp}));
    sessionStorage.removeItem('journal_drive_err');sessionStorage.removeItem('journal_drive_tried');
  }
  history.replaceState(null,'',location.pathname+location.search);
}
function getDriveToken(){try{const t=JSON.parse(localStorage.getItem('journal_drive_tok')||'null');if(t&&t.exp>Date.now())return t.tok;}catch(e){}return null;}
function driveAuthRedirect(interactive){
  const p=new URLSearchParams({client_id:CLIENT_ID,redirect_uri:location.origin+location.pathname,response_type:'token',scope:DRIVE_SCOPE,state:'journal_drive',include_granted_scopes:'true'});
  if(currentUserEmail)p.set('login_hint',currentUserEmail);
  if(!interactive)p.set('prompt','none');
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+p.toString();
}
// Returns true if it navigated away to silently reconnect (so callers must not
// start another redirect this tick — a second location.href would clobber this one).
function driveBoot(){
  driveAccessToken=getDriveToken();
  if(driveAccessToken){
    localStorage.setItem(`journal_drive_on_${currentUser}`,'1');
    driveSyncNow(false);
    return false;
  }
  if(localStorage.getItem(`journal_drive_on_${currentUser}`)&&!sessionStorage.getItem('journal_drive_tried')){
    sessionStorage.setItem('journal_drive_tried','1');
    driveAuthRedirect(false);
    return true;
  }
  return false;
}
function driveTokenInvalid(){localStorage.removeItem('journal_drive_tok');driveAccessToken=null;}
function enableDriveSync(){sessionStorage.removeItem('journal_drive_err');lastSyncError=null;driveAuthRedirect(true);}
function disableDriveSync(){driveTokenInvalid();localStorage.removeItem(`journal_drive_on_${currentUser}`);if(driveSyncTimer){clearTimeout(driveSyncTimer);driveSyncTimer=null;}showView('settings');}
async function driveFetch(url,opts){
  const res=await fetch(url,opts);
  if(res.status===401){driveTokenInvalid();throw new Error('Google sign-in expired — tap Reconnect sync in Style.');}
  if(res.status===403){let msg='';try{const j=await res.json();msg=(j.error&&j.error.message)||'';}catch(e){}throw new Error(msg||'Google Drive refused the request (403).');}
  if(!res.ok)throw new Error('Drive error '+res.status);
  return res;
}
function scheduleDriveSync(){
  if(!driveAccessToken)return;
  if(driveSyncTimer)clearTimeout(driveSyncTimer);
  driveSyncTimer=setTimeout(()=>{driveSyncNow(false);},2500);
}
async function driveSyncNow(manual){
  if(!driveAccessToken||!currentUser||currentUser==='local')return;
  try{
    const verdict=await pullAndMerge();
    if(verdict!=='insync')await pushToDrive();
    await syncPhotoFiles();
    lastSyncAt=Date.now();lastSyncError=null;
    if(manual){alert('Synced successfully ✓');showView('settings');}
    else if(currentView==='settings')showView('settings');
  }catch(e){
    lastSyncError=(e&&e.message)?e.message:String(e);
    if(manual)alert('Sync failed: '+lastSyncError);
  }
}
async function pullAndMerge(){
  const auth={headers:{Authorization:'Bearer '+driveAccessToken}};
  const res=await driveFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27${DRIVE_FILENAME}%27&fields=files(id)`,auth);
  const list=await res.json();
  const file=(list.files||[])[0];
  if(!file){driveFileId=null;return 'nofile';}
  driveFileId=file.id;
  const dr=await driveFetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`,auth);
  const p=await dr.json();
  if(!p||typeof p!=='object')return 'nofile';
  // Merge per-entry and per-template: the newer 'updated' stamp wins for each item.
  const lE=userData('entries',{}),rE=p.entries||{};
  const mE={};
  new Set(Object.keys(lE).concat(Object.keys(rE))).forEach(k=>{
    const a=lE[k],b=rE[k];
    mE[k]=!a?b:(!b?a:(((a.updated||0)>=(b.updated||0))?a:b));
  });
  const lT=userData('templates',[]),rT=p.templates||[];
  const byId={};
  rT.concat(lT).forEach(t=>{const cur=byId[t.id];if(!cur||(t.updated||0)>(cur.updated||0))byId[t.id]=t;});
  const mT=Object.values(byId).sort((a,b)=>(a.created||0)-(b.created||0));
  const lS=userData('settings',{}),rS=p.settings||{};
  const mS=((lS.updated||0)>=(rS.updated||0))?lS:rS;
  const lSt=userData('stars',{}),rSt=p.stars||{};
  const mSt=((lSt.updated||0)>=(rSt.updated||0))?lSt:rSt;
  const lSc=userData('scorecard',{}),rSc=p.scorecard||{};
  const mSc=((lSc.updated||0)>=(rSc.updated||0))?lSc:rSc;
  const lW=userData('workouts',{}),rW=p.workouts||{};
  const mW=((lW.updated||0)>=(rW.updated||0))?lW:rW;
  const mStr=JSON.stringify({e:mE,t:mT,s:mS,st:mSt,sc:mSc,w:mW});
  const localChanged=mStr!==JSON.stringify({e:lE,t:lT,s:lS,st:lSt,sc:lSc,w:lW});
  const pushNeeded=mStr!==JSON.stringify({e:rE,t:rT,s:rS,st:rSt,sc:rSc,w:rW});
  if(localChanged){
    setStore(userKey('entries'),mE);setStore(userKey('templates'),mT);setStore(userKey('settings'),mS);setStore(userKey('stars'),mSt);setStore(userKey('scorecard'),mSc);setStore(userKey('workouts'),mW);
    applyAppearance();mirrorReminders(mS);refreshView(true);
  }
  const migrated=await migrateInlinePhotos();
  return (pushNeeded||migrated)?'pushneeded':'insync';
}
async function pushToDrive(){
  if(!driveAccessToken||!currentUser)return;
  const body=JSON.stringify({v:1,entries:userData('entries',{}),templates:userData('templates',[]),settings:userData('settings',{}),stars:userData('stars',{}),scorecard:userData('scorecard',{}),workouts:userData('workouts',{}),at:Date.now()});
  if(driveFileId){
    await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,{method:'PATCH',headers:{Authorization:'Bearer '+driveAccessToken,'Content-Type':'application/json'},body});
  }else{
    const form=new FormData();
    form.append('metadata',new Blob([JSON.stringify({name:DRIVE_FILENAME,parents:['appDataFolder']})],{type:'application/json'}));
    form.append('file',new Blob([body],{type:'application/json'}));
    const cr=await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+driveAccessToken},body:form});
    const created=await cr.json();
    if(created.id)driveFileId=created.id;
  }
}

// ── PHOTO FILE SYNC (full-res photos live as individual files in appDataFolder) ──
function referencedPhotoIds(){
  const all=getEntriesRaw();const ids=[];
  Object.keys(all).forEach(k=>{const e=all[k];if(e&&!e.deleted&&Array.isArray(e.photos))e.photos.forEach(p=>{if(p&&p.id)ids.push(p.id);});});
  // workout activity photos sync the same way
  (workoutsData().list||[]).forEach(w=>(w.activities||[]).forEach(a=>{if(a.media&&a.media.type==='photo'&&a.media.photoId)ids.push(a.media.photoId);}));
  return ids;
}
function photoFileName(id){return 'dbphoto_'+id+'.jpg';}
async function listRemotePhotos(){
  const auth={headers:{Authorization:'Bearer '+driveAccessToken}};
  const map={};let pageToken='';
  do{
    let url=`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${encodeURIComponent("name contains 'dbphoto_'")}&fields=nextPageToken,files(id,name)&pageSize=1000`;
    if(pageToken)url+='&pageToken='+encodeURIComponent(pageToken);
    const j=await (await driveFetch(url,auth)).json();
    (j.files||[]).forEach(f=>{map[f.name]=f.id;});
    pageToken=j.nextPageToken||'';
  }while(pageToken);
  return map;
}
async function uploadAppDataPhoto(id,blob){
  const form=new FormData();
  form.append('metadata',new Blob([JSON.stringify({name:photoFileName(id),parents:['appDataFolder']})],{type:'application/json'}));
  form.append('file',blob,photoFileName(id));
  await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+driveAccessToken},body:form});
}
let photoSyncRunning=false;
async function syncPhotoFiles(){
  if(!driveAccessToken||!currentUser||currentUser==='local'||photoSyncRunning)return;
  const ids=Array.from(new Set(referencedPhotoIds()));
  if(!ids.length)return;
  photoSyncRunning=true;
  try{
    const remote=await listRemotePhotos();
    const auth={headers:{Authorization:'Bearer '+driveAccessToken}};
    // Pull: referenced photos we don't have locally yet
    let pulled=false;
    for(const id of ids){
      const fn=photoFileName(id);
      if(remote[fn]&&!(await idbGetPhoto(id))){
        try{const blob=await (await driveFetch(`https://www.googleapis.com/drive/v3/files/${remote[fn]}?alt=media`,auth)).blob();await idbPutPhoto(id,blob);pulled=true;}catch(e){}
      }
    }
    // Push: referenced photos not on Drive yet
    for(const id of ids){
      if(!remote[photoFileName(id)]){
        const blob=await idbGetPhoto(id);
        if(blob){try{await uploadAppDataPhoto(id,blob);}catch(e){}}
      }
    }
    if(pulled&&(currentView==='today'||currentView==='entries'))refreshView(false);   // only when photos actually arrived
  }finally{photoSyncRunning=false;}
}
async function ensurePhotoLocal(id){
  if(!driveAccessToken||currentUser==='local')return null;
  try{
    const auth={headers:{Authorization:'Bearer '+driveAccessToken}};
    const url=`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${encodeURIComponent("name='"+photoFileName(id)+"'")}&fields=files(id)`;
    const f=((await (await driveFetch(url,auth)).json()).files||[])[0];
    if(!f)return null;
    const blob=await (await driveFetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`,auth)).blob();
    await idbPutPhoto(id,blob);return blob;
  }catch(e){return null;}
}
async function deleteRemotePhoto(id){
  if(!driveAccessToken||currentUser==='local')return;
  try{
    const auth={headers:{Authorization:'Bearer '+driveAccessToken}};
    const url=`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${encodeURIComponent("name='"+photoFileName(id)+"'")}&fields=files(id)`;
    const f=((await (await driveFetch(url,auth)).json()).files||[])[0];
    if(f)await driveFetch(`https://www.googleapis.com/drive/v3/files/${f.id}`,{method:'DELETE',headers:{Authorization:'Bearer '+driveAccessToken}});
  }catch(e){}
}

async function renderBkPicker(){
  const token=getBkToken();
  if(!token){closeModal();alert('Your Google Drive connection expired — reconnect in Settings.');return;}
  const cur=bkPickStack[bkPickStack.length-1];
  const q=encodeURIComponent(`'${cur.id}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  let items=[];
  try{
    const r=await bkFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&pageSize=200&orderBy=name`,{headers:{Authorization:'Bearer '+token}});
    const j=await r.json();
    items=j.files||[];
  }catch(e){
    openModal(`<p style="color:var(--accent)">Could not list your Drive folders: ${esc(e.message)}</p><div class="tb-actions"><button class="btn" onclick="closeModal()">Close</button></div>`,'Google Drive');

async function bkBackupNow(manual){
  const s=settingsData(),gd=s.gdriveBackup||{};
  if(!gd.enabled||!gd.folderId)return;
  const token=getBkToken();
  if(!token){if(manual)alert('Reconnect Google Drive backup in Settings.');return;}
  const body=JSON.stringify({v:1,entries:userData('entries',{}),templates:userData('templates',[]),settings:userData('settings',{}),stars:userData('stars',{}),scorecard:userData('scorecard',{}),workouts:userData('workouts',{}),exported:Date.now()});
  try{
    const auth={headers:{Authorization:'Bearer '+token}};
    const q=encodeURIComponent(`'${gd.folderId}' in parents and name='${BACKUP_FILENAME}' and trashed=false`);
    const lr=await bkFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`,auth);
    const lj=await lr.json();
    const existing=(lj.files||[])[0];
    if(existing){
      await bkFetch(`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=media`,{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body});
    }else{
      const form=new FormData();
      form.append('metadata',new Blob([JSON.stringify({name:BACKUP_FILENAME,parents:[gd.folderId]})],{type:'application/json'}));
      form.append('file',new Blob([body],{type:'application/json'}));
      await bkFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+token},body:form});
    }
    lastBkBackupAt=Date.now();lastBkBackupError=null;
    if(manual){alert('Backed up to Google Drive ✓');showView('settings');}
  }catch(e){
    lastBkBackupError=e.message;
    if(manual)alert('Backup failed: '+e.message);
  }
}
function scheduleBkBackup(){
  const s=settingsData();if(!(s.gdriveBackup&&s.gdriveBackup.enabled))return;
  if(bkBackupTimer)clearTimeout(bkBackupTimer);
  bkBackupTimer=setTimeout(()=>bkBackupNow(false),4000);
}

// ── REMINDERS (best-effort local notifications, no backend) ──
// The service worker can't read localStorage, so reminder config is mirrored into
// a small IndexedDB it can open itself; 'lastFired' lives there too so both the
// foreground check (page open) and the periodicsync check (page closed) agree on
// what's already fired today, however either one runs.
const REMINDER_DB='daybook_reminders',REMINDER_STORE='kv';
function remDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(REMINDER_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(REMINDER_STORE))req.result.createObjectStore(REMINDER_STORE);};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function remGet(key){const db=await remDB();return new Promise((resolve,reject)=>{const tx=db.transaction(REMINDER_STORE,'readonly');const rq=tx.objectStore(REMINDER_STORE).get(key);rq.onsuccess=()=>resolve(rq.result);rq.onerror=()=>reject(rq.error);});}
async function remSet(key,val){const db=await remDB();return new Promise((resolve,reject)=>{const tx=db.transaction(REMINDER_STORE,'readwrite');tx.objectStore(REMINDER_STORE).put(val,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}
async function mirrorReminders(s){
  try{
    const cur=(await remGet('state'))||{reminders:[],lastFired:{}};
    cur.reminders=(s.reminders||[]).map(r=>({id:r.id,label:r.label,time:r.time,days:r.days,enabled:r.enabled}));
    await remSet('state',cur);
    checkDueRemindersForeground();
  }catch(e){}
}
async function setupReminderSW(){
  if(!('serviceWorker' in navigator))return;
  try{
    const reg=await navigator.serviceWorker.register('sw.js');
    if(reg.periodicSync&&navigator.permissions){
      try{
        const status=await navigator.permissions.query({name:'periodic-background-sync'});
        if(status.state==='granted')await reg.periodicSync.register('daybook-reminder-check',{minInterval:15*60*1000});
      }catch(e){}
    }
  }catch(e){}
}
async function checkDueRemindersForeground(){
  if(!('serviceWorker' in navigator)||!('Notification' in window)||Notification.permission!=='granted')return;
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    if(!reg)return;
    const state=(await remGet('state'))||{reminders:[],lastFired:{}};
    const reminders=state.reminders||[];
    if(!reminders.length)return;
    const now=new Date(),dk=dkey(now),mins=now.getHours()*60+now.getMinutes();
    let changed=false;
    for(const r of reminders){
      if(!r.enabled)continue;
      if(!(r.days||[]).includes(now.getDay()))continue;
      const parts=(r.time||'20:00').split(':').map(Number);
      if(mins<parts[0]*60+parts[1])continue;
      if(state.lastFired[r.id]===dk)continue;
      await reg.showNotification('Daybook',{body:r.label||'Time to write in your journal.',icon:'icon.svg',tag:'daybook-reminder-'+r.id});
      state.lastFired[r.id]=dk;changed=true;
    }
    if(changed)await remSet('state',state);
  }catch(e){}
}
async function requestNotifPermission(){
  if(!('Notification' in window)){alert('Notifications are not supported in this browser.');return;}
  await Notification.requestPermission();
  showView('settings');
  checkDueRemindersForeground();
}

function commitDraft(k){const dft=drafts[k];if(!dft)return;if(dsaveTimers[k]){clearTimeout(dsaveTimers[k]);delete dsaveTimers[k];}if(entryHasContent(dft))putEntry(k,dft);markSaveStatus('saved ✓');}
// Background refreshes (a sync finishing, photos arriving) must never rebuild the screen while you are typing: that removes the box
// you are typing in and closes the phone keyboard. They wait until you leave the field, then run.
let pendingRefresh=false,pendingRefreshClear=false;
function userIsTyping(){
  const a=document.activeElement;if(!a)return false;
  if(a.tagName==='TEXTAREA'||a.tagName==='SELECT')return true;
  return a.tagName==='INPUT'&&!/^(checkbox|radio|button|submit|range|color|file)$/.test(a.type);
}
function refreshView(clearDrafts){
  if(userIsTyping()){pendingRefresh=true;pendingRefreshClear=pendingRefreshClear||!!clearDrafts;return;}
  const clr=clearDrafts||pendingRefreshClear;pendingRefresh=false;pendingRefreshClear=false;
  if(clr){flushDrafts();}
  showView(currentView);
}
document.addEventListener('focusout',()=>{if(!pendingRefresh)return;setTimeout(()=>{if(pendingRefresh&&!userIsTyping())refreshView(false);},400);});
function flushDrafts(){Object.keys(dsaveTimers).forEach(k=>clearTimeout(dsaveTimers[k]));dsaveTimers={};Object.keys(drafts).forEach(k=>{if(entryHasContent(drafts[k]))putEntry(k,drafts[k]);});drafts={};}
function clearDraftCache(){Object.keys(dsaveTimers).forEach(k=>clearTimeout(dsaveTimers[k]));dsaveTimers={};drafts={};}
// Resize a writing box to fit its text. It used to collapse to 'auto' and re-measure on EVERY keystroke, which makes the box jump each time
// a line wraps at the right edge and can close the phone keyboard. Now it only grows when the text no longer fits, and only re-measures
// (shrinks) when text has been deleted.
function autogrow(t){
  const len=t.value.length,prev=t._agLen==null?-1:t._agLen;t._agLen=len;
  if(!t.style.height||len<prev){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';return;}
  if(t.scrollHeight>t.clientHeight)t.style.height=(t.scrollHeight+2)+'px';
}

function loadImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=ev=>{const im=new Image();im.onerror=reject;im.onload=()=>resolve(im);im.src=ev.target.result;};r.readAsDataURL(file);});}
function scaleDims(w,h,max){if(w>max||h>max){const s=max/Math.max(w,h);return {w:Math.round(w*s),h:Math.round(h*s)};}return {w,h};}
function drawToCanvas(im,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);return c;}
function canvasBlob(canvas,q){return new Promise(res=>canvas.toBlob(b=>res(b),'image/jpeg',q));}
async function processPhoto(file){
  const im=await loadImage(file);

  const th=scaleDims(im.width,im.height,200);

// ── LOCAL MEDIA STORE (IndexedDB) ──
// Binary media must NOT live in localStorage (~5MB cap). Full-res photos are cached
// here and mirrored to Drive appDataFolder so they still sync across devices; only a
// tiny thumbnail is kept in the entry itself. Videos are kept here on-device only.
const MEDIA_DB_NAME='daybook_videos',VIDEO_STORE='videos',PHOTO_STORE='photos',MAX_VIDEO_BYTES=300*1024*1024;
function mediaDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(MEDIA_DB_NAME,2);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(VIDEO_STORE))db.createObjectStore(VIDEO_STORE);if(!db.objectStoreNames.contains(PHOTO_STORE))db.createObjectStore(PHOTO_STORE);};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbPut(store,id,blob){
  const db=await mediaDB();
  return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(blob,id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});
}
async function idbGet(store,id){
  const db=await mediaDB();
  return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readonly');const rq=tx.objectStore(store).get(id);rq.onsuccess=()=>resolve(rq.result||null);rq.onerror=()=>reject(rq.error);});
}
async function idbDelete(store,id){
  const db=await mediaDB();
  return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});
}
function idbPutVideo(id,b){return idbPut(VIDEO_STORE,id,b);}
function idbGetVideo(id){return idbGet(VIDEO_STORE,id);}
function idbDeleteVideo(id){return idbDelete(VIDEO_STORE,id);}
function idbPutPhoto(id,b){return idbPut(PHOTO_STORE,id,b);}
function idbGetPhoto(id){return idbGet(PHOTO_STORE,id);}
function idbDeletePhoto(id){return idbDelete(PHOTO_STORE,id);}
function blobToDataURL(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob);});}
function videoThumbnail(file){
  return new Promise(resolve=>{
    const url=URL.createObjectURL(file);
    const v=document.createElement('video');
    v.preload='metadata';v.muted=true;v.playsInline=true;
    v.onloadedmetadata=()=>{try{v.currentTime=Math.min(.2,(v.duration||1)/4);}catch(e){URL.revokeObjectURL(url);resolve(null);}};
    v.onseeked=()=>{
      try{
        const max=480;let w=v.videoWidth||320,h=v.videoHeight||180;
        if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(v,0,0,w,h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg',.7));
      }catch(e){URL.revokeObjectURL(url);resolve(null);}
    };
    v.onerror=()=>{URL.revokeObjectURL(url);resolve(null);};
    v.src=url;
  });
}
async function addVideos(files){

// ── VOICE ──
let micActive=false,micStopReq=false,micLastStart=0;
function toggleMic(btn){
  if(!SR){alert('Voice typing isn’t available in this browser. Try Chrome, or use the microphone key on your on-screen keyboard.');return;}
  if(rec){const same=(btn===recBtn);stopMicManual();if(same)return;}
  const wrap=btn.closest('.vfield');const el=wrap&&wrap.querySelector('input,textarea');if(!el)return;
  recEl=el;recBtn=btn;recBase=el.value?el.value.replace(/\s+$/,'')+' ':'';
  micActive=true;micStopReq=false;
  btn.classList.add('rec');
  micStart();
}
function micStart(){
  try{rec=new SR();}catch(e){return micFail('Voice typing could not start on this device.');}
  rec.continuous=true;rec.interimResults=true;rec.lang=navigator.language||'en-GB';
  rec.onresult=ev=>{
    let inter='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const r=ev.results[i];
      if(r.isFinal)recBase=recBase.replace(/\s+$/,'')+(recBase.trim()?' ':'')+r[0].transcript.trim()+' ';
      else inter+=r[0].transcript;
    }
    if(recEl){recEl.value=recBase+inter;recEl.dispatchEvent(new Event('input',{bubbles:true}));}
  };
  rec.onerror=ev=>{
    const x=ev.error;
    if(x==='no-speech'||x==='aborted')return; // benign — onend decides whether to keep going
    micActive=false;
    if(x==='not-allowed'||x==='service-not-allowed')micFail('Microphone access is blocked. Open this app’s site settings in your browser, turn the Microphone on, then tap the mic again.');
    else if(x==='audio-capture')micFail('No microphone was found on this device.');
    else if(x==='network')micFail('Voice typing needs an internet connection and couldn’t reach the service. Check your connection and try again.');
    else if(x==='language-not-supported')micFail('Voice typing isn’t available for this language on your device.');
    else micFail('Voice typing stopped unexpectedly ('+x+'). Please try again.');
  };
  rec.onend=()=>{
    if(!micActive||micStopReq){micFinish();return;}
    // Mobile Chrome ends recognition after each pause — restart to keep dictating,
    // but if it ends almost instantly the service is failing, so stop instead of looping.
    if(Date.now()-micLastStart<700){micFinish();return;}
    micLastStart=Date.now();
    try{rec.start();}catch(e){micFinish();}
  };
  micLastStart=Date.now();
  try{rec.start();}catch(e){micFail('Voice typing could not start. Please try again.');}
}
function stopMicManual(){micStopReq=true;micActive=false;if(rec){try{rec.stop();}catch(e){}}micFinish();}
function stopMic(){if(rec||micActive)stopMicManual();}
function micFinish(){if(recBtn)recBtn.classList.remove('rec');rec=null;recBtn=null;recEl=null;micActive=false;}
function micFail(msg){micFinish();alert(msg);}

// ── HABIT SCORECARD (based on the Atomic Habits Habits Scorecard) ──
let scDraft=null; // the in-progress rating run, or null when viewing the summary
function scorecardData(){return Object.assign({habits:[],cards:[],cadence:'week'},userData('scorecard',{}));}
function saveScorecard(patch){const s=Object.assign(scorecardData(),patch);s.updated=Date.now();saveData('scorecard',s);}
function ensureScorecardSeeded(){if(userData('scorecard',null))return;saveScorecard({habits:[],cards:[],cadence:'week'});}
// One-time removal of the habits originally auto-seeded by the app, so the user starts
// with a clean list they build themselves. Only removes untouched seed labels; runs once.
const OLD_SC_SEED=['Woke up at a good time','Made my bed','Checked my phone first thing','Ate a healthy breakfast','Moved my body / exercised','Drank enough water','Ate well through the day','Mindless scrolling','Time outdoors','Read or learned something','Alcohol / junk food','Went to bed on time'];
function cleanupSeededHabits(){
  const raw=userData('scorecard',null);
  if(!raw||raw.seedCleared)return;
  const seedSet=new Set(OLD_SC_SEED.map(s=>s.toLowerCase()));
  const kept=(raw.habits||[]).filter(h=>!seedSet.has(String(h.label||'').trim().toLowerCase()));
  saveScorecard({habits:kept,seedCleared:true});
}
function clearAllHabits(){
  if(!(scorecardData().habits||[]).length){closeModal();return;}
  if(!confirm('Remove all habits from your list? Past scorecards keep their scores.'))return;
  saveScorecard({habits:[]});
  openHabitsManager();
}
function refreshScorecard(){renderScorecard(document.getElementById('view'));}
function isoWeekKey(d){const dt=new Date(d.getFullYear(),d.getMonth(),d.getDate());const day=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-day+3);const firstThu=new Date(dt.getFullYear(),0,4);const wk=1+Math.round(((dt-firstThu)/86400000-3+((firstThu.getDay()+6)%7))/7);return dt.getFullYear()+'-W'+String(wk).padStart(2,'0');}
function scPeriodKey(dateStr,cadence){if(cadence==='day')return dateStr;if(cadence==='month')return dateStr.slice(0,7);if(cadence==='week')return isoWeekKey(parseKey(dateStr));return dateStr+'|'+Math.random();}
function scPeriodLabel(cadence){return cadence==='day'?'today':cadence==='month'?'this month':cadence==='week'?'this week':'';}
function scoreCard(card){let g=0,n=0,b=0;const r=(card&&card.ratings)||{};Object.values(r).forEach(v=>{if(v==='+')g++;else if(v==='-')b++;else if(v==='=')n++;});return {good:g,neutral:n,bad:b,net:g-b,rated:g+n+b};}
function scCardsSorted(){return (scorecardData().cards||[]).slice().sort((a,b)=>(a.date<b.date?1:a.date>b.date?-1:(b.at||0)-(a.at||0)));}
function scCurrentPeriodCard(){const d=scorecardData();if(d.cadence==='none')return null;const pk=scPeriodKey(dkey(new Date()),d.cadence);return (d.cards||[]).find(c=>scPeriodKey(c.date,d.cadence)===pk)||null;}
function scorecardDue(){const d=scorecardData();if(!d.cadence||d.cadence==='none'||!(d.habits||[]).length)return false;return !scCurrentPeriodCard();}

let graphPeriod='weekly'; // weekly | monthly | yearly
function weekMonday(d){const dt=new Date(d.getFullYear(),d.getMonth(),d.getDate());const day=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-day);return dkey(dt);}
function bucketKey(dateStr,period){const d=parseKey(dateStr);if(period==='daily')return dateStr;if(period==='yearly')return String(d.getFullYear());if(period==='monthly')return dateStr.slice(0,7);return weekMonday(d);}
function bucketLabel(key,period){if(period==='yearly')return key;if(period==='monthly'){const p=key.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-GB',{month:'short'});}const d=parseKey(key);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function scoreSeries(period){
  const cards=scorecardData().cards||[];
  const buckets={};
  cards.forEach(c=>{const key=bucketKey(c.date,period);(buckets[key]=buckets[key]||[]).push(scoreCard(c).net);});
  return Object.keys(buckets).sort().map(k=>({label:bucketLabel(k,period),value:Math.round((buckets[k].reduce((a,b)=>a+b,0)/buckets[k].length)*10)/10})).slice(-12);
}
function intentionSeries(period){
  const all=getEntriesRaw();const buckets={};
  Object.keys(all).forEach(k=>{const e=all[k];if(!e||e.deleted)return;if(e.done!==true&&e.done!==false)return;const key=bucketKey(k,period);const b=(buckets[key]=buckets[key]||{t:0,n:0});if(e.done===true)b.t++;b.n++;});
  return Object.keys(buckets).sort().map(k=>({label:bucketLabel(k,period),value:Math.round((buckets[k].t/buckets[k].n)*100)})).slice(-12);
}
// Inline SVG line chart. points=[{label,value}]; opts {min,max,suffix}
function lineChartSVG(points,opts){
  opts=opts||{};
  if(!points.length)return '<div class="empty-note" style="padding:28px 10px">Not enough data yet — it fills in as you go.</div>';
  const W=320,H=180,padL=30,padR=10,padT=12,padB=30;
  const vals=points.map(p=>p.value);
  let min=opts.min!==undefined?opts.min:Math.min(...vals);
  let max=opts.max!==undefined?opts.max:Math.max(...vals);
  if(min===max){min-=1;max+=1;}
  const plotW=W-padL-padR,plotH=H-padT-padB;
  const x=i=>padL+(points.length===1?plotW/2:(i/(points.length-1))*plotW);
  const y=v=>padT+plotH-((v-min)/(max-min))*plotH;
  const suffix=opts.suffix||'';
  let grid='',i;
  for(i=0;i<=2;i++){const gv=min+(max-min)*(i/2);const gy=y(gv);grid+=`<line class="grid" x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}"/><text class="yl" x="${padL-4}" y="${gy+3}" text-anchor="end">${Math.abs(max-min)>=20?Math.round(gv):Math.round(gv*10)/10}${suffix}</text>`;}
  if(min<0&&max>0){const z=y(0);grid+=`<line class="zero" x1="${padL}" y1="${z}" x2="${W-padR}" y2="${z}"/>`;}
  const line=points.map((p,idx)=>`${x(idx)},${y(p.value)}`).join(' ');
  const dots=points.map((p,idx)=>`<circle class="dot" cx="${x(idx)}" cy="${y(p.value)}" r="3"/>`).join('');
  const n=points.length;
  const step=Math.ceil(n/6);
  const xlabels=points.map((p,idx)=>{if(n>6&&idx!==n-1&&(idx%step!==0||n-1-idx<step))return '';return `<text class="xl" x="${x(idx)}" y="${H-10}" text-anchor="middle">${esc(p.label)}</text>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="line-chart" preserveAspectRatio="xMidYMid meet">${grid}<polyline class="ln" points="${line}"/>${dots}${xlabels}</svg>`;
}
function starsSeries(period){
  const log=(starsData().log||[]).filter(l=>l.type==='earn');
  const buckets={};
  log.forEach(l=>{if(!l.at)return;const key=bucketKey(dkey(new Date(l.at)),period);buckets[key]=(buckets[key]||0)+(l.stars||0);});
  return Object.keys(buckets).sort().map(k=>({label:bucketLabel(k,period),value:buckets[k]})).slice(-12);
}
function balanceSeries(period){
  const log=(starsData().log||[]).filter(l=>l.at).slice().sort((a,b)=>a.at-b.at);
  if(!log.length)return [];
  const bucketEnd={};let bal=0;
  log.forEach(l=>{bal+=(l.type==='spend'?-(l.stars||0):(l.stars||0));bucketEnd[bucketKey(dkey(new Date(l.at)),period)]=bal;});
  return Object.keys(bucketEnd).sort().map(k=>({label:bucketLabel(k,period),value:bucketEnd[k]})).slice(-12);
}
function habitTotals(){
  const d=scorecardData(),cards=d.cards||[];
  return (d.habits||[]).map(h=>{
    let pos=0,neg=0,neu=0;
    cards.forEach(c=>{const r=(c.ratings||{})[h.id];if(r==='+')pos++;else if(r==='-')neg++;else if(r==='=')neu++;});
    return {label:h.label,pos,neg,neu,net:pos-neg,total:pos+neg+neu};
  }).filter(x=>x.total>0).sort((a,b)=>b.net-a.net);
}
function habitTotalsHTML(){
  const rows=habitTotals();
  if(!rows.length)return '<div class="empty-note" style="padding:24px 10px">No habit ratings yet — do a scorecard to fill this in.</div>';
  const maxAbs=Math.max(1,...rows.map(r=>Math.abs(r.net)));
  return `<div class="habit-bars">${rows.map(r=>{
    const w=Math.round(Math.abs(r.net)/maxAbs*50),cls=r.net>=0?'pos':'neg';
    return `<div class="hb-row"><span class="hb-label"><span class="hb-name">${esc(r.label)}</span><span class="hb-sub">${r.pos} positive · ${r.neg} negative${r.neu?' · '+r.neu+' neutral':''}</span></span><span class="hb-track"><span class="hb-center"></span><span class="hb-fill ${cls}" style="width:${w}%"></span></span><span class="hb-val ${cls}">${r.net>0?'+':''}${r.net}</span></div>`;
  }).join('')}</div>`;
}

// ── HEALTH (Fitbit data via the Google Health API, read-only) ──
// Same Google client as Drive sync, with its own token and redirect state. Day values are
// cached on this device only (not synced to Drive) — they can always be fetched again.
const HEALTH_API='https://health.googleapis.com/v4/users/me/dataTypes/';
const HEALTH_SCOPES=['activity_and_fitness','sleep','health_metrics_and_measurements'].map(s=>`https://www.googleapis.com/auth/googlehealth.${s}.readonly`).join(' ');
const HEALTH_DAYS=84; // first fetch; later refreshes re-fetch the last 14 days
let healthDay=null,healthRange=14,healthBusy=false,healthErr=null,healthReturn=false,healthAttempt=0;
function getHealthToken(){try{const t=JSON.parse(localStorage.getItem('journal_health_tok2')||'null');if(t&&t.exp>Date.now())return t.tok;}catch(e){}return null;}
function healthTokenInvalid(){localStorage.removeItem('journal_health_tok2');}
function healthOn(){return !!localStorage.getItem(`journal_health_on_${currentUser}`);}
function healthAuthRedirect(interactive){
  const p=new URLSearchParams({client_id:CLIENT_ID,redirect_uri:location.origin+location.pathname,response_type:'token',scope:HEALTH_SCOPES,state:'daybook_health'});
  if(currentUserEmail)p.set('login_hint',currentUserEmail);
  p.set('prompt',interactive?'consent':'none');
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+p.toString();
}
function checkHealthRedirect(){
  if(!location.hash)return;
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('state')!=='daybook_health')return;
  healthReturn=true;
  const err=h.get('error');
  if(err){sessionStorage.setItem('journal_health_err',err);}
  else if(h.get('access_token')){
    const exp=Date.now()+(parseInt(h.get('expires_in')||'3600',10)-60)*1000;
    localStorage.setItem('journal_health_tok2',JSON.stringify({tok:h.get('access_token'),exp}));
    sessionStorage.removeItem('journal_health_err');sessionStorage.removeItem('journal_health_tried');
  }
  history.replaceState(null,'',location.pathname+location.search);
}
function connectHealth(){sessionStorage.removeItem('journal_health_err');healthAuthRedirect(true);}
function disconnectHealth(){
  if(!confirm('Disconnect Fitbit? The numbers already fetched are removed from this device.'))return;
  healthTokenInvalid();localStorage.removeItem(`journal_health_on_${currentUser}`);setStore(userKey('health'),{});
  showView('health');
}
function healthData(){return Object.assign({days:{},fetched:0},userData('health',{}));}
function hDate(d){return {year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate()};}
function hKey(o){return o&&o.year?`${o.year}-${String(o.month).padStart(2,'0')}-${String(o.day).padStart(2,'0')}`:null;}
function addDays(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
async function healthFetch(url,opts){
  const tok=getHealthToken();if(!tok)throw new Error('Fitbit sign-in expired — tap Connect Fitbit again.');
  opts=Object.assign({},opts);opts.headers=Object.assign({Authorization:'Bearer '+tok},opts.headers||{});
  const res=await fetch(url,opts);
  if(res.status===401){healthTokenInvalid();throw new Error('Fitbit sign-in expired — tap Connect Fitbit again.');}
  if(!res.ok){let msg='';try{const j=await res.json();msg=(j.error&&j.error.message)||'';}catch(e){}throw new Error(msg||'Google Health error '+res.status);}
  return res.json();
}
// Daily totals for [start,end) — some types only allow 14 days per request, so it chunks.
async function healthRollup(type,start,end,maxDays){
  const out=[];
  for(let s=start;s<end;s=addDays(s,maxDays)){

async function healthSync(){

    healthRollup('steps',start,end,90).then(r=>r.forEach(p=>p.steps&&put(rk(p),'steps',+p.steps.countSum))),
    healthRollup('distance',start,end,90).then(r=>r.forEach(p=>p.distance&&put(rk(p),'km',Math.round(p.distance.millimetersSum/1e4)/100))),
    healthRollup('active-minutes',start,end,14).then(r=>r.forEach(p=>{

    healthRollup('weight',start,end,90).then(r=>r.forEach(p=>p.weight&&p.weight.weightGramsAvg&&put(rk(p),'kg',Math.round(p.weight.weightGramsAvg/100)/10))),

    healthList('sleep',`sleep.interval.civil_end_time >= "${from}"`,25).then(r=>{

function wkFixTimes(items,total){

function wkAdjust(delta){
  const P=wkPlayer;if(!P)return;
  const items=P.items,idx=P.idx,others=items.filter((_,i)=>i!==idx);
  const maxForCur=P.total-5*others.length;
  let newT=Math.min(maxForCur,Math.max(5,Math.round(items[idx].time)+delta));
  const otherOld=others.reduce((a,x)=>a+x.time,0),otherNew=P.total-newT;

function starsEarnedOn(dateKey){const start=parseKey(dateKey).getTime(),end=start+86400000;return (starsData().log||[]).filter(l=>l.type==='earn'&&l.at>=start&&l.at<end).reduce((a,l)=>a+(l.stars||0),0);}

// Auto-scaling slider max: rounds up to a "nice" number a bit above the current balance.
function starsMax(bal){
  if(bal<100)return 100;
  const mag=Math.pow(10,Math.floor(Math.log10(bal)));
  return Math.ceil((bal*1.2)/mag)*mag;
}
function fmtStars(n){return n>=1000?(Math.round(n/100)/10)+'k':String(n);}
function starsTimeAgo(ts){
  if(!ts)return'';
  const diff=Date.now()-ts,mins=Math.floor(diff/60000);
  if(mins<2)return'Just now';
  if(mins<60)return`${mins}m ago`;
  const hrs=Math.floor(mins/60);
  if(hrs<24)return`${hrs}h ago`;
  const days=Math.floor(hrs/24);
  if(days<7)return`${days} day${days!==1?'s':''} ago`;
  return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

function showToast(msg,good){

function bumpBalance(newBal){

function earnStars(id,btn){
  const s=starsData();
  const a=s.earnActivities.find(x=>x.id===id);if(!a)return;
  if(btn&&btn.dataset.busy)return; // guard against rapid double-taps adding loads of stars
  s.balance=(s.balance||0)+a.stars;
  s.log=(s.log||[]).concat([{id:uid(),type:'earn',label:a.label,stars:a.stars,at:Date.now()}]);
  saveStars(s);
  showToast('+'+a.stars+' ★ earned',true);
  bumpBalance(s.balance);
  if(btn){
    btn.dataset.busy='1';btn.disabled=true;btn.classList.add('earned');
    btn.textContent='Earned +'+a.stars+' ✓';

  }else refreshRewards();
}
function redeemReward(id){
  const s=starsData();
  const r=s.spendRewards.find(x=>x.id===id);if(!r)return;
  if((s.balance||0)<r.stars){alert(`You need ${r.stars} ★ for this — you have ${s.balance} ★.`);return;}
  if(!confirm(`Redeem "${r.label}" for ${r.stars} ★?`))return;
  s.balance=s.balance-r.stars;
  s.log=(s.log||[]).concat([{id:uid(),type:'spend',label:r.label,stars:r.stars,at:Date.now()}]);
  saveStars(s);
  showToast('−'+r.stars+' ★ · '+r.label);
  bumpBalance(s.balance);

}
function openEditLogItem(id){

function saveLogItem(id){
  const label=(document.getElementById('li-label').value||'').trim();
  const stars=Math.max(0,Math.round(Number(document.getElementById('li-stars').value)||0));
  if(!label){alert('Add a description.');return;}
  const s=starsData();
  const l=(s.log||[]).find(x=>x.id===id);if(!l)return;
  const oldDelta=l.type==='earn'?l.stars:-l.stars;
  const newDelta=l.type==='earn'?stars:-stars;
  s.balance=(s.balance||0)+(newDelta-oldDelta);
  l.label=label;l.stars=stars;
  saveStars(s);closeModal();refreshRewards();
}
function deleteLogItem(id){
  if(!confirm('Delete this activity? Your star balance will be adjusted to undo it.'))return;
  const s=starsData();
  const l=(s.log||[]).find(x=>x.id===id);if(!l)return;
  const delta=l.type==='earn'?l.stars:-l.stars;
  s.balance=(s.balance||0)-delta;
  s.log=(s.log||[]).filter(x=>x.id!==id);
  saveStars(s);refreshRewards();
}
function openAddStarsItem(kind,editId){
  const s=starsData();

function saveStarsItem(kind,id){
  const label=(document.getElementById('si-label').value||'').trim();
  const stars=Math.max(1,Math.round(Number(document.getElementById('si-stars').value)||0));
  if(!label||!stars){alert('Add a name and a star value of at least 1.');return;}
  const s=starsData();
  const arrKey=kind==='earn'?'earnActivities':'spendRewards';
  const arr=s[arrKey].slice();
  const idx=id?arr.findIndex(x=>x.id===id):-1;
  if(idx>=0)arr[idx]=Object.assign({},arr[idx],{label,stars});
  else arr.push({id:uid(),label,stars});
  s[arrKey]=arr;
  saveStars(s);closeModal();rewardsTab=kind;refreshRewards();

function deleteStarsItem(kind,id){
  if(!confirm('Remove this from the list?'))return;
